<script>
(() => {
  const button = document.querySelector('.ph-menu-toggle');
  const nav = document.querySelector('.ph-nav');
  button?.addEventListener('click', () => {
    const open = button.getAttribute('aria-expanded') !== 'true';
    button.setAttribute('aria-expanded', String(open));
    nav.classList.toggle('is-open', open);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && button?.getAttribute('aria-expanded') === 'true') {
      button.setAttribute('aria-expanded', 'false'); nav.classList.remove('is-open'); button.focus();
    }
  });
  const main = document.querySelector('main, .page-body');
  if (main && !document.getElementById('main-content')) main.id = 'main-content';
})();
</script>
